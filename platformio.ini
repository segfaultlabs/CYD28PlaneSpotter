; Two boards, one codebase: shared.h/data.cpp are compiled into both
; environments unchanged; each environment's build_src_filter excludes the
; other board's display_*.cpp so neither ever references a display library
; it doesn't have installed.
[platformio]
boards_dir = boards

[env:cyd]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<display_jc4832.cpp> -<AXS15231B_touch.cpp> -<display_lcd7b.cpp> -<display_lcd7b_v2.cpp> -<IOExtension.cpp> -<GT911_touch.cpp>

; Automatically fetch required libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; CYD-specific display configuration injected directly into TFT_eSPI
build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

; JC4832W535 (ESP32-S3, 480x320, AXS15231B/QSPI) — see src/display_jc4832.cpp
; for hardware bring-up notes (borrowed pin mapping, not yet on-hardware
; calibrated). board = esp32-s3-n16r8v is vendored in boards/ (matches this
; board's actual ESP32-S3-WROOM-1-N16R8 module: 16MB flash, 8MB PSRAM).
[env:jc4832]
platform = espressif32@6.6.0
board = esp32-s3-n16r8v
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<display_cyd.cpp> -<display_lcd7b.cpp> -<display_lcd7b_v2.cpp> -<IOExtension.cpp> -<GT911_touch.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    moononournation/GFX Library for Arduino @ 1.4.5

; ESP32-S3-Touch-LCD-7B (Waveshare, ESP32-S3, 1024x600, ST7701 direct RGB
; panel + GT911 touch over I2C, no display command interface) — see
; src/display_lcd7b.cpp for hardware notes. Pins/timings sourced from
; Waveshare's own official example repo, not guessed. Same N16R8 module as
; the JC4832W535, board = esp32-s3-n16r8v reused as-is.
[env:lcd7b]
platform = espressif32@6.6.0
board = esp32-s3-n16r8v
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<display_cyd.cpp> -<display_jc4832.cpp> -<AXS15231B_touch.cpp> -<display_lcd7b_v2.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    moononournation/GFX Library for Arduino @ 1.4.5

; Experimental variant of the LCD-7B: same hardware, same shared.h/data.cpp,
; but a real double-buffered RGB panel via raw ESP-IDF esp_lcd calls (num_fbs=2)
; instead of Arduino_GFX's Arduino_ESP32RGBPanel, which has never supported
; true double buffering at any version (confirmed by reading the current 1.6.7
; source directly). Requires ESP32 Arduino core 3.x for the newer ESP-IDF's
; esp_lcd_rgb_panel_config_t (num_fbs/bounce_buffer_size_px don't exist in the
; 2.0.14 core the other environments use) -- official PlatformIO's
; espressif32 platform doesn't support core 3.x at all, so this points at
; pioarduino/platform-espressif32, the community fork that does. Kept as a
; fully separate environment + source file (display_lcd7b_v2.cpp) rather than
; replacing [env:lcd7b], so the proven-working four-screen UI stays available
; as a fallback regardless of how this experiment goes.
[env:lcd7b_v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-n16r8v
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<display_cyd.cpp> -<display_jc4832.cpp> -<AXS15231B_touch.cpp> -<display_lcd7b.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    moononournation/GFX Library for Arduino @ ^1.6.7
; Phase-3 display config: 120MHz octal PSRAM + 120MHz flash (the recipe
; Waveshare's own heavy LVGL demo for this board ships, and Espressif's
; tested requirement for pclk > ~22MHz). Mechanics, learned the hard way:
;  - board_build.f_boot drives the COMPILE-TIME unified frequency in
;    pioarduino's sdkconfig generator (f_boot overrides f_flash), so this
;    is what emits SPIRAM_SPEED_120M / FLASHFREQ_120M / EXPERIMENTAL / HPM.
;  - board_build.f_image feeds esptool's --flash-freq for image headers and
;    must stay 80m: the S3 ROM boots flash at <=80MHz (esptool rejects
;    '120m' headers); the 2nd-stage bootloader switches to 120MHz at runtime.
;  - "# CONFIG_X is not set" lines are silently STRIPPED by the platformio
;    INI parser from multi-line option values, so choice-symbol overrides
;    can't be done inline — that's why the f_boot route is required.
; Triggers pioarduino's HybridCompile full IDF-libs rebuild — first build
; after editing is LONG. NOTE: the resulting firmware.factory.bin must be
; USB-flashed (bootloader changes) — OTA only updates the app partition.
board_build.f_boot = 120000000L
board_build.f_image = 80000000L
custom_sdkconfig =
    CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR=y
    CONFIG_SPIRAM_TIMING_MEASURE_TEMPERATURE_INTERVAL_SECOND=5
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    CONFIG_BOOTLOADER_FLASH_DC_AWARE=y